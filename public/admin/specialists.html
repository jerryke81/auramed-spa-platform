<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialists | AuraMed Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Specialists</h1>
          <p>Appear on the public Specialists page once added</p>
        </div>
        <button class="btn" id="addBtn">+ Add Specialist</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Photo</th><th>Name</th><th>Specializes In</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">No specialists yet — add the first one.</div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Add Specialist</h2>
      <div class="error-banner" id="formError"></div>
      <form id="form">
        <input type="hidden" id="specialistId">
        <input type="hidden" id="photoUrl">
        <div class="form-group">
          <label>Photo <span style="color:var(--danger)">(required)</span></label>
          <div style="display:flex; align-items:center; gap:1rem;">
            <img id="imagePreview" src="" alt="" style="width:64px; height:64px; border-radius:50%; object-fit:cover; background:var(--bg-sand); display:none;">
            <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp">
          </div>
          <p style="font-size:0.75rem; color:var(--text-muted); margin-top:0.35rem;">JPEG, PNG, or WebP, up to 5MB.</p>
        </div>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="name" required placeholder="e.g. Dr. Evelyn Thorne">
        </div>
        <div class="form-group">
          <label>Academic Background</label>
          <textarea id="academicBackground" required placeholder="e.g. MD, Johns Hopkins; Board Certified Dermatology"></textarea>
        </div>
        <div class="form-group">
          <label>Work Experience</label>
          <textarea id="workExperience" required placeholder="e.g. 12 years clinical aesthetics, former Chief of..."></textarea>
        </div>
        <div class="form-group">
          <label>Specializes In (treatments)</label>
          <div id="treatmentCheckboxes" style="border:1px solid var(--border); border-radius:6px; padding:0.75rem; max-height:140px; overflow-y:auto;"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    AdminAuth.requireAuth(["SUPER_ADMIN"]);
    AdminAuth.renderSidebar("specialists.html");

    const rowsEl = document.getElementById("rows");
    const emptyState = document.getElementById("emptyState");
    const modalOverlay = document.getElementById("modalOverlay");
    const form = document.getElementById("form");
    const formError = document.getElementById("formError");
    const imageFileInput = document.getElementById("imageFile");
    const imagePreview = document.getElementById("imagePreview");
    let treatments = [];

    imageFileInput.addEventListener("change", () => {
      const file = imageFileInput.files[0];
      if (!file) return;
      imagePreview.src = URL.createObjectURL(file);
      imagePreview.style.display = "block";
    });

    function openModal(specialist) {
      form.reset();
      formError.classList.remove("show");
      imageFileInput.value = "";
      document.getElementById("modalTitle").textContent = specialist ? "Edit Specialist" : "Add Specialist";
      document.getElementById("specialistId").value = specialist ? specialist.id : "";

      const existingPhoto = specialist ? specialist.photoUrl : "";
      document.getElementById("photoUrl").value = existingPhoto || "";
      if (existingPhoto) {
        imagePreview.src = existingPhoto;
        imagePreview.style.display = "block";
      } else {
        imagePreview.style.display = "none";
      }

      if (specialist) {
        document.getElementById("name").value = specialist.name;
        document.getElementById("academicBackground").value = specialist.academicBackground;
        document.getElementById("workExperience").value = specialist.workExperience;
      }

      const selectedIds = specialist ? specialist.treatments.map((t) => t.treatmentId) : [];
      document.getElementById("treatmentCheckboxes").innerHTML = treatments.length
        ? treatments.map((t) => `
            <label style="display:flex; align-items:center; gap:0.5rem; padding:0.25rem 0; font-size:0.85rem;">
              <input type="checkbox" value="${t.id}" ${selectedIds.includes(t.id) ? "checked" : ""} style="width:auto;">
              ${t.name}
            </label>`).join("")
        : "<p style='color:var(--text-muted); font-size:0.85rem;'>No treatments yet — add one first on the Treatments page.</p>";

      modalOverlay.classList.add("open");
    }
    function closeModal() { modalOverlay.classList.remove("open"); }

    document.getElementById("addBtn").addEventListener("click", () => openModal(null));
    document.getElementById("cancelBtn").addEventListener("click", closeModal);

    async function loadTreatments() {
      treatments = await AdminAuth.authFetch("/api/treatments/admin/all");
    }

    async function loadSpecialists() {
      const specialists = await AdminAuth.authFetch("/api/specialists");
      emptyState.style.display = specialists.length ? "none" : "block";
      rowsEl.innerHTML = specialists.map((s) => `
        <tr>
          <td><img src="${s.photoUrl}" alt="${s.name}" style="width:44px; height:44px; border-radius:50%; object-fit:cover;" onerror="this.style.opacity=0.2"></td>
          <td>${s.name}</td>
          <td>${s.treatments.map((t) => t.treatment.name).join(", ") || "—"}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-outline btn-small" onclick="editSpecialist('${s.id}')">Edit</button>
            <button class="btn btn-danger btn-small" onclick="deleteSpecialist('${s.id}')">Delete</button>
          </td>
        </tr>
      `).join("");
      window._specialists = specialists;
    }

    window.editSpecialist = (id) => openModal(window._specialists.find((s) => s.id === id));

    window.deleteSpecialist = async (id) => {
      if (!confirm("Delete this specialist? This can't be undone.")) return;
      await AdminAuth.authFetch(`/api/specialists/${id}`, { method: "DELETE" });
      loadSpecialists();
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.classList.remove("show");
      const id = document.getElementById("specialistId").value;
      const treatmentIds = Array.from(document.querySelectorAll("#treatmentCheckboxes input:checked")).map((el) => el.value);
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;

      try {
        let photoUrl = document.getElementById("photoUrl").value;
        const selectedFile = imageFileInput.files[0];
        if (selectedFile) {
          saveBtn.textContent = "Uploading photo...";
          photoUrl = await AdminAuth.uploadImage(selectedFile);
        }
        if (!photoUrl) {
          throw new Error("A photo is required.");
        }

        const payload = {
          name: document.getElementById("name").value,
          photoUrl,
          academicBackground: document.getElementById("academicBackground").value,
          workExperience: document.getElementById("workExperience").value,
          treatmentIds,
        };

        saveBtn.textContent = "Save";
        if (id) {
          await AdminAuth.authFetch(`/api/specialists/${id}`, { method: "PUT", body: JSON.stringify(payload) });
        } else {
          await AdminAuth.authFetch("/api/specialists", { method: "POST", body: JSON.stringify(payload) });
        }
        closeModal();
        loadSpecialists();
      } catch (err) {
        formError.textContent = err.message;
        formError.classList.add("show");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save";
      }
    });

    (async () => {
      await loadTreatments();
      await loadSpecialists();
    })();
  </script>
</body>
</html>
