<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AuraMed Spa & Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 400px;
    }
    .login-box .brand { text-align: center; margin-bottom: 0.25rem; font-size: 1.5rem; }
    .login-box .brand-sub {
      text-align: center; display: block; margin-bottom: 2rem;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted);
    }
    .login-box button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">AURAMED</div>
    <span class="brand-sub">Admin Portal</span>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@spa.local">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    // If already logged in, skip straight to dashboard
    if (AdminAuth.getToken()) window.location.href = "/admin/dashboard.html";

    const form = document.getElementById("loginForm");
    const errorBanner = document.getElementById("errorBanner");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.classList.remove("show");
      submitBtn.textContent = "Signing in...";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        AdminAuth.setSession(data.token, data.role);
        window.location.href = "/admin/dashboard.html";
      } catch (err) {
        errorBanner.textContent = err.message;
        errorBanner.classList.add("show");
        submitBtn.textContent = "Sign In";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
