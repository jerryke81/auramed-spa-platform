<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatment Details | AuraMed Spa & Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1c2b24; --accent: #d4af37; --bg-sand: #faf8f5;
      --text-dark: #222222; --text-muted: #666666; --border: rgba(28,43,36,0.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg-sand); color:var(--text-dark); }
    .top-nav { padding:1.5rem 4rem; display:flex; justify-content:space-between; align-items:center; }
    .top-nav a.back { color:var(--primary); text-decoration:none; font-size:0.9rem; }
    .top-nav .brand { font-family:'Playfair Display',serif; font-size:1.3rem; letter-spacing:1px; color:var(--primary); }
    .hero-image { width:100%; height:360px; object-fit:cover; }
    .content { max-width:820px; margin:0 auto; padding:3rem 2rem 5rem; }
    .tag { color:var(--accent); text-transform:uppercase; letter-spacing:2px; font-size:0.75rem; font-weight:500; }
    h1 { font-family:'Playfair Display',serif; font-weight:400; font-size:2.4rem; color:var(--primary); margin:0.75rem 0 1.5rem; }
    .meta-strip { display:flex; gap:2.5rem; padding:1.5rem 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:2rem; }
    .meta-item .label { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); }
    .meta-item .value { font-size:1.2rem; color:var(--primary); font-family:'Playfair Display',serif; }
    .section { margin-bottom:2.5rem; }
    .section h2 { font-family:'Playfair Display',serif; font-weight:400; font-size:1.3rem; color:var(--primary); margin-bottom:0.85rem; }
    .section p { line-height:1.75; color:var(--text-dark); white-space:pre-wrap; }
    .specialists-list { display:flex; gap:1rem; flex-wrap:wrap; }
    .specialist-chip { display:flex; align-items:center; gap:0.6rem; background:#fff; border:1px solid var(--border); border-radius:30px; padding:0.4rem 1rem 0.4rem 0.4rem; }
    .specialist-chip img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
    .cta-strip { text-align:center; padding-top:1.5rem; }
    .cta-btn { display:inline-block; background:var(--primary); color:#fff; padding:1rem 2.5rem; border-radius:4px; text-decoration:none; font-size:0.95rem; letter-spacing:0.5px; }
    .msg { text-align:center; padding:5rem 2rem; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="treatments.html" class="back">← All Treatments</a>
    <span class="brand">AURAMED</span>
  </div>

  <div id="container">
    <div class="msg">Loading...</div>
  </div>

  <script>
    const treatmentId = new URLSearchParams(window.location.search).get("id");
    const container = document.getElementById("container");

    function firstImage(images) {
      try { return JSON.parse(images || "[]")[0] || "/images/gallery/img-001-14885905-w600.jpg"; }
      catch (e) { return "/images/gallery/img-001-14885905-w600.jpg"; }
    }

    function render(t) {
      document.title = `${t.name} | AuraMed Spa & Wellness`;
      container.innerHTML = `
        <img src="${firstImage(t.images)}" alt="${t.name}" class="hero-image">
        <div class="content">
          <span class="tag">${t.category}</span>
          <h1>${t.name}</h1>

          <div class="meta-strip">
            <div class="meta-item"><div class="label">Duration</div><div class="value">${t.durationValue} ${t.durationUnit.toLowerCase()}</div></div>
            <div class="meta-item"><div class="label">Cost</div><div class="value">$${t.costUsd}</div></div>
          </div>

          <div class="section">
            <h2>About This Treatment</h2>
            <p>${t.description}</p>
          </div>

          ${t.historyOfProcedure ? `
            <div class="section">
              <h2>Background</h2>
              <p>${t.historyOfProcedure}</p>
            </div>` : ""}

          ${t.patientRequirements ? `
            <div class="section">
              <h2>Please Note</h2>
              <p>${t.patientRequirements}</p>
            </div>` : ""}

          ${t.specialists && t.specialists.length ? `
            <div class="section">
              <h2>Performed By</h2>
              <div class="specialists-list">
                ${t.specialists.map(s => `
                  <div class="specialist-chip">
                    <img src="${s.specialist.photoUrl}" alt="" onerror="this.style.visibility='hidden'">
                    ${s.specialist.name}
                  </div>
                `).join("")}
              </div>
            </div>` : ""}

          <div class="cta-strip">
            <a href="appointment.html?treatmentId=${t.id}" class="cta-btn">Book This Treatment</a>
          </div>
        </div>
      `;
    }

    (async () => {
      if (!treatmentId) {
        container.innerHTML = `<div class="msg">No treatment specified. <a href="treatments.html">Browse all treatments</a>.</div>`;
        return;
      }
      try {
        const res = await fetch(`/api/treatments/${treatmentId}`);
        if (!res.ok) throw new Error("Treatment not found");
        const treatment = await res.json();
        render(treatment);
      } catch (err) {
        container.innerHTML = `<div class="msg">Couldn't load this treatment. <a href="treatments.html">Browse all treatments</a>.</div>`;
      }
    })();
  </script>
</body>
</html>
